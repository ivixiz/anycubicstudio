[package]
name = "anycubicstudio"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[build-dependencies]
cc = "1"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
futures-util = "0.3"
crc32fast = "1"
flate2 = "1"
md-5 = "0.10"
rayon = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "7.2", default-features = false, features = ["deflate"] }
